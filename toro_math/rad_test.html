<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>√ 비교</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR&family=Noto+Sans+Math&display=swap" rel="stylesheet">
<style>
body{background:#0f172a;color:#e2e8f0;font-family:'Noto Sans KR',sans-serif;padding:24px;max-width:500px;margin:0 auto}
h3{color:#86efac;margin:0 0 20px;font-size:1rem}
.box{background:#1e293b;border-radius:12px;padding:18px 22px;margin-bottom:14px}
.title{color:#94a3b8;font-size:.75rem;margin-bottom:12px}
.row{margin-bottom:8px}
.big{font-size:2.2rem}

/* MathML 기본 스타일 */
math { font-size: 1em; }
</style>
</head>
<body>

<h3>√ 표기 비교</h3>

<div class="box">
  <div class="title">① 현재 (수정 전)</div>
  <div class="big row">√2</div>
  <div class="row">√2 = p/q 가정, √3, √36</div>
</div>

<div class="box">
  <div class="title">② MathML (브라우저 내장 수식)</div>
  <div class="big row">
    <math display="inline"><msqrt><mn>2</mn></msqrt></math>
  </div>
  <div class="row">
    <math display="inline"><msqrt><mn>2</mn></msqrt></math> = p/q 가정,
    <math display="inline"><msqrt><mn>3</mn></msqrt></math>,
    <math display="inline"><msqrt><mn>36</mn></msqrt></math>
  </div>
</div>

<div class="box">
  <div class="title">③ Noto Sans Math 폰트</div>
  <div class="big row" style="font-family:'Noto Sans Math',sans-serif">√2</div>
  <div class="row" style="font-family:'Noto Sans Math',sans-serif">√2 = p/q 가정, √3, √36</div>
</div>

<div class="box">
  <div class="title">④ Times New Roman (수학 폰트)</div>
  <div class="big row" style="font-family:'Times New Roman',serif">√2</div>
  <div class="row" style="font-family:'Times New Roman',serif">√2 = p/q 가정, √3, √36</div>
</div>

</body>
</html>
